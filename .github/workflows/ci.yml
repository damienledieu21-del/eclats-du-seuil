name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
      # Recettes par catégorie : échec si une catégorie n'exécute aucun test (correctif 6.1).
      - run: bash scripts/test-category.sh -c Release Numeric Formula Data Build Engine Resources Regression Limits Status Trigger Modifier Shield Support Bastion Scenario Runtime Network Space Presence Behavior Scene Duo
      # Correctif 7.3.1 (D4) : scénario de référence avec déclencheurs, simulé par la CLI, comparé octet par octet au journal figé, puis rejoué.
      - name: Scénario entrainement_declencheurs (simulation, comparaison, rejeu)
        run: |
          dotnet run --no-build -c Release --project src/EdS.Cli -- simulate scenarios/entrainement_declencheurs.json --out "$RUNNER_TEMP/declencheurs.jsonl"
          cmp "$RUNNER_TEMP/declencheurs.jsonl" tests/EdS.Data.Tests/Fixtures/reference-0.21.0-contenu-0.6.0/entrainement_declencheurs.jsonl
          dotnet run --no-build -c Release --project src/EdS.Cli -- replay "$RUNNER_TEMP/declencheurs.jsonl"
      # Correctif 7.3.1 : Debug aussi, où les réserves de budget sont vérifiées exactes à chaque traitement.
      - run: dotnet build --no-restore -c Debug -warnaserror
      - run: dotnet test --no-build -c Debug
      # These commands run only when every previous test step has succeeded.
      # This is an UNSIGNED self-report, NOT independent CI attestation.
      - name: Check EdS CI report generator (offline)
        run: python3 -m unittest discover -s scripts -p 'test_ci_provenance.py' -v
      - name: EdS CI unsigned self-report v2
        if: success()
        env:
          EDS_CI_JOB_KEY: build-test
          EDS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/make_ci_provenance.py
      - name: Upload EdS CI self-report for independent examination
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eds-ci-provenance
          path: ${{ runner.temp }}/eds-provenance.json
          if-no-files-found: error
          retention-days: 14
