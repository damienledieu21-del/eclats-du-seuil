name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
      # Recettes par catégorie : échec si une catégorie n'exécute aucun test (correctif 6.1).
      - run: bash scripts/test-category.sh -c Release Numeric Formula Data Build Engine Resources Regression
